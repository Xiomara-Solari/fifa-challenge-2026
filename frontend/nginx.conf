server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Evita cachear index.html para que el navegador detecte nuevos despliegues
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # Los archivos JS/CSS generados por ng build llevan hash único en producción
  location ~* \.(?:js|css|ico|png|jpg|jpeg|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Fallback SPA: delega rutas como /players/5 o /login al Router de Angular
  location / {
    try_files $uri $uri/ /index.html;
  }
}
